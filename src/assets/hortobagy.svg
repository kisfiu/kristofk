<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <title>Hortobágy puszta with the Nine-hole Bridge (eight arches and a sun glint), grey cattle, racka sheep and a far-away Parliament</title>
  <!-- Original drawing for the KK desktop, in a simple 2000s-wallpaper style: the Hortobágy puszta with the
       Nine-hole Bridge, grey cattle, racka sheep, storks, a sweep well, and (impossibly) the Parliament.
       Classes used by the page: .sun / .moon / .glint (weather and night), .animal .cow / .sheep / .black (clicks). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b5fd0" />
      <stop offset=".35" stop-color="#3f86e6" />
      <stop offset=".65" stop-color="#7fb6f2" />
      <stop offset=".88" stop-color="#cfe6ff" />
      <stop offset="1" stop-color="#eef6ff" />
    </linearGradient>
    <linearGradient id="plain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4dcac" />
      <stop offset=".2" stop-color="#d6c88a" />
      <stop offset=".55" stop-color="#bba966" />
      <stop offset="1" stop-color="#93824a" />
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86c6ec" />
      <stop offset=".5" stop-color="#5aa4dc" />
      <stop offset="1" stop-color="#3a80c2" />
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6eedc" />
      <stop offset=".5" stop-color="#e6d9bb" />
      <stop offset="1" stop-color="#cdbd99" />
    </linearGradient>
    <linearGradient id="archshade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a4a60" />
      <stop offset="1" stop-color="#466f8a" />
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset=".6" stop-color="#fff" stop-opacity=".5" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cloudshade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset=".7" stop-color="#ffffff" />
      <stop offset="1" stop-color="#d6e6f8" />
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3c20" />
      <stop offset=".5" stop-color="#8a6038" />
      <stop offset="1" stop-color="#5a3c20" />
    </linearGradient>
    <!-- grey cattle: darker forequarters, pale hindquarters -->
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b3ada2" />
      <stop offset=".45" stop-color="#ddd8ce" />
      <stop offset="1" stop-color="#ebe7df" />
    </linearGradient>
    <radialGradient id="wool" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".35" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glint" cx=".5" cy=".8" r=".8">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset=".45" stop-color="#fff6c4" />
      <stop offset="1" stop-color="#f1d98c" />
    </radialGradient>
    <radialGradient id="moonglow">
      <stop offset="0" stop-color="#eef2ff" stop-opacity=".7" />
      <stop offset="1" stop-color="#eef2ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sunglow">
      <stop offset="0" stop-color="#fffbe6" />
      <stop offset=".3" stop-color="#fff3b8" stop-opacity=".9" />
      <stop offset="1" stop-color="#fff3b8" stop-opacity="0" />
    </radialGradient>

    <!-- a puffy cartoon cloud with a flat, slightly shaded base (local ~260x90) -->
    <g id="cloud" fill="url(#cloudshade)">
      <circle cx="70" cy="52" r="36" />
      <circle cx="120" cy="38" r="44" />
      <circle cx="176" cy="50" r="34" />
      <circle cx="216" cy="62" r="24" />
      <rect x="40" y="56" width="200" height="34" rx="17" />
    </g>

    <!-- Hungarian grey cattle, facing left, lyre-shaped horns (local size ~140x96) -->
    <g id="cow">
      <rect x="-4" y="-4" width="146" height="102" fill="transparent" /><!-- whole-body hit area for clicks -->
      <g fill="#8a8479">
        <rect x="26" y="58" width="10" height="34" rx="4" />
        <rect x="42" y="60" width="10" height="32" rx="4" />
        <rect x="100" y="60" width="10" height="32" rx="4" />
        <rect x="115" y="58" width="10" height="34" rx="4" />
      </g>
      <g fill="#3d3832">
        <rect x="26" y="88" width="10" height="5" rx="2" />
        <rect x="42" y="88" width="10" height="5" rx="2" />
        <rect x="100" y="88" width="10" height="5" rx="2" />
        <rect x="115" y="88" width="10" height="5" rx="2" />
      </g>
      <path d="M130 36 C137 46 136 60 133 70" stroke="#8a8479" stroke-width="3" fill="none" stroke-linecap="round" />
      <path d="M131 66 C137 70 137 76 132 78 C128 76 128 70 131 66 Z" fill="#4a453e" />
      <!-- body, with a little hump over the shoulders -->
      <path d="M22 36 C20 22 34 12 54 12 C76 10 104 14 122 18 C134 22 134 40 131 52 C127 62 116 66 100 66 L40 66 C26 64 23 50 22 36 Z" fill="url(#coat)" />
      <path d="M40 60 C62 70 98 70 114 62 L113 66 L40 66 Z" fill="#c4beb2" />
      <!-- head and neck -->
      <path d="M30 26 C22 24 12 28 6 34 C0 40 2 50 10 53 L24 52 C32 46 34 34 30 26 Z" fill="#a49e93" />
      <ellipse cx="8" cy="48" rx="6" ry="5" fill="#3d3832" />
      <circle cx="17" cy="35" r="2" fill="#2a2621" />
      <path d="M24 30 l9 -6 l1 7 z" fill="#8f897e" />
      <!-- long lyre horns: out, then up -->
      <path d="M18 30 C6 26 0 16 8 2" stroke="#f3ead6" stroke-width="4" fill="none" stroke-linecap="round" />
      <path d="M22 30 C34 24 38 12 30 0" stroke="#e8dec6" stroke-width="4" fill="none" stroke-linecap="round" />
      <path d="M8 2 l-2 5 M30 0 l2 5" stroke="#3d3832" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- racka sheep, facing left, long straight spiral horns in a V (local size ~62x50); wool colour = currentColor -->
    <g id="sheep">
      <rect x="-2" y="-4" width="66" height="56" fill="transparent" /><!-- whole-body hit area for clicks -->
      <g stroke="#3a332c" stroke-width="3.2" stroke-linecap="round">
        <path d="M19 36 v13 M27 37 v12 M43 37 v12 M51 36 v13" />
      </g>
      <g fill="currentColor">
        <circle cx="22" cy="25" r="11" />
        <circle cx="33" cy="19" r="12" />
        <circle cx="45" cy="21" r="11" />
        <circle cx="54" cy="29" r="9" />
        <circle cx="28" cy="33" r="10" />
        <circle cx="43" cy="33" r="10" />
      </g>
      <ellipse cx="34" cy="22" rx="18" ry="12" fill="url(#wool)" />
      <path d="M14 18 C6 18 2 24 4 30 C6 34 12 34 16 30 Z" fill="#3a332c" />
      <ellipse cx="15" cy="22" rx="5" ry="2.5" fill="#3a332c" transform="rotate(30 15 22)" />
      <circle cx="9" cy="23" r="1.4" fill="#f3efe6" />
      <g stroke="#e3d6bc" stroke-width="3" stroke-dasharray="3.5 1.5" stroke-linecap="round">
        <path d="M9 18 L1 0" />
        <path d="M12 18 L20 0" />
      </g>
    </g>

    <!-- a white stork in flight (local ~70x24) -->
    <g id="stork">
      <path d="M0 12 C14 4 26 4 34 10 C42 4 56 4 70 12 C56 10 44 12 36 14 C28 12 14 10 0 12 Z" fill="#fff" />
      <path d="M0 12 C6 9 10 8 14 8 L12 12 Z M70 12 C64 9 60 8 56 8 L58 12 Z" fill="#1f1f1f" />
      <ellipse cx="35" cy="13" rx="9" ry="3.5" fill="#fff" />
      <path d="M26 13 l-10 1" stroke="#e2402c" stroke-width="2" stroke-linecap="round" />
      <path d="M44 13 l10 3" stroke="#e2402c" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- a Gothic pinnacle for the Parliament -->
    <path id="spire" d="M0 0 l3 -14 l3 14 z" />
  </defs>

  <!-- sky and puffy clouds -->
  <rect width="1600" height="640" fill="url(#sky)" />
  <use href="#cloud" transform="translate(190 90) scale(1.05)" />
  <use href="#cloud" transform="translate(820 60) scale(.8)" />
  <use href="#cloud" transform="translate(1250 170) scale(1.15)" />
  <use href="#cloud" transform="translate(40 330) scale(.55)" opacity=".85" />
  <use href="#cloud" transform="translate(1000 380) scale(.5)" opacity=".8" />

  <!-- the sun, low over the bridge: it makes the "ninth hole" -->
  <g class="sun">
    <circle cx="600" cy="300" r="120" fill="url(#sunglow)" />
    <circle cx="600" cy="300" r="30" fill="#fffbe6" />
  </g>
  <!-- at night (weather.ts sets data-daylight) the sun is swapped for this moon -->
  <g class="moon" display="none">
    <circle cx="600" cy="300" r="90" fill="url(#moonglow)" />
    <circle cx="600" cy="300" r="26" fill="#f2efe1" />
    <g fill="#d9d4bf"><circle cx="592" cy="292" r="5" /><circle cx="609" cy="306" r="7" /><circle cx="598" cy="314" r="3" /></g>
  </g>

  <!-- two white storks crossing the sky -->
  <g class="storks">
    <use href="#stork" transform="translate(860 230) scale(1.1)" />
    <use href="#stork" transform="translate(940 262) scale(.85)" />
  </g>

  <!-- far horizon: the Parliament, small and hazy, and a few distant tree clumps -->
  <g fill="#94acc6" opacity=".85">
    <rect x="1040" y="592" width="290" height="32" />
    <rect x="1040" y="584" width="40" height="10" />
    <rect x="1290" y="584" width="40" height="10" />
    <rect x="1167" y="572" width="36" height="22" />
    <path d="M1163 574 C1163 548 1207 548 1207 574 Z" />
    <path d="M1182 552 l3 -26 l3 26 z" />
    <rect x="1128" y="566" width="8" height="28" />
    <rect x="1234" y="566" width="8" height="28" />
    <path d="M1128 566 l4 -14 l4 14 z M1234 566 l4 -14 l4 14 z" />
    <use href="#spire" x="1043" y="584" /><use href="#spire" x="1072" y="584" />
    <use href="#spire" x="1293" y="584" /><use href="#spire" x="1322" y="584" />
    <use href="#spire" x="1092" y="592" /><use href="#spire" x="1108" y="592" />
    <use href="#spire" x="1146" y="592" /><use href="#spire" x="1214" y="592" />
    <use href="#spire" x="1252" y="592" /><use href="#spire" x="1268" y="592" />
  </g>
  <g fill="#9ea78a" opacity=".65">
    <ellipse cx="140" cy="618" rx="60" ry="12" />
    <ellipse cx="180" cy="612" rx="30" ry="10" />
    <ellipse cx="610" cy="620" rx="40" ry="9" />
    <ellipse cx="1490" cy="620" rx="70" ry="11" />
    <ellipse cx="1530" cy="613" rx="32" ry="9" />
  </g>

  <!-- the plain, with soft bands for depth -->
  <rect y="620" width="1600" height="380" fill="url(#plain)" />
  <rect y="590" width="1600" height="60" fill="url(#haze)" />
  <g fill="#e9dfb2" opacity=".55">
    <ellipse cx="1150" cy="700" rx="380" ry="18" />
    <ellipse cx="300" cy="760" rx="300" ry="16" />
  </g>
  <g fill="#a8955a" opacity=".35">
    <ellipse cx="1250" cy="880" rx="420" ry="30" />
    <ellipse cx="900" cy="960" rx="380" ry="34" />
  </g>

  <!-- pale alkaline (szikes) patches on the dry grass -->
  <g fill="#f0eacf" opacity=".55">
    <ellipse cx="1180" cy="712" rx="170" ry="9" />
    <ellipse cx="1420" cy="790" rx="120" ry="10" />
    <ellipse cx="980" cy="905" rx="150" ry="12" />
  </g>

  <!-- the only lush green: wet grass along the river banks -->
  <g fill="#8d9a4a" opacity=".6">
    <path d="M300 672 C260 760 150 850 0 900 L0 945 C170 884 304 782 334 672 Z" />
    <path d="M884 672 C870 740 780 820 670 1000 L724 1000 C812 842 892 762 908 672 Z" />
  </g>

  <!-- the Hortobágy river flowing toward us under the bridge -->
  <path d="M318 672 L878 672 C860 740 760 800 640 1000 L0 1000 L0 900 C140 850 270 760 318 672 Z" fill="url(#river)" />
  <path d="M318 672 C270 760 140 850 0 900 M878 672 C860 740 760 800 640 1000" stroke="#2f6ea8" stroke-width="3" fill="none" opacity=".35" />
  <!-- the bridge's reflection -->
  <path d="M300 676 L900 676 Q600 700 300 676 Z" fill="#f6eedc" opacity=".25" />
  <g stroke="#d9eefb" stroke-width="3" stroke-linecap="round" opacity=".75">
    <path d="M430 724 h60 M640 706 h80 M380 794 h90 M520 840 h70 M240 904 h110 M150 960 h70 M420 950 h60" />
  </g>

  <!-- reeds and cattails on both banks -->
  <g stroke="#5f7a2e" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M268 742 l-4 -26 M274 742 l2 -32 M280 742 l6 -24 M190 812 l-4 -28 M196 812 l2 -34 M203 812 l6 -26" />
    <path d="M884 724 l-4 -26 M890 724 l2 -32 M897 724 l6 -24 M800 846 l-4 -28 M806 846 l2 -34 M813 846 l6 -26" />
    <path d="M100 868 l-3 -30 M106 868 l3 -36 M112 868 l7 -28" />
  </g>
  <g fill="#7a4e2a">
    <rect x="273" y="704" width="5" height="12" rx="2.5" />
    <rect x="195" y="772" width="5" height="12" rx="2.5" />
    <rect x="889" y="686" width="5" height="12" rx="2.5" />
    <rect x="805" y="806" width="5" height="12" rx="2.5" />
    <rect x="106" y="826" width="5" height="12" rx="2.5" />
  </g>

  <!-- the Nine-hole Bridge: stone, a gentle hump, a parapet and cutwaters -->
  <path d="M250 676 L300 642 Q600 610 900 642 L950 676 Z" fill="url(#stone)" stroke="#b3a27e" stroke-width="2" />
  <path d="M296 646 Q600 614 904 646" stroke="#fffaf0" stroke-width="6" fill="none" stroke-linecap="round" />
  <path d="M300 652 Q600 621 900 652" stroke="#c9b892" stroke-width="1.5" fill="none" opacity=".8" />
  <g fill="url(#archshade)">
    <path d="M309 676 v-10 a24 13 0 0 1 48 0 v10 z" />
    <path d="M376 676 v-12 a24 15 0 0 1 48 0 v12 z" />
    <path d="M442 676 v-13 a24 17 0 0 1 48 0 v13 z" />
    <path d="M509 676 v-14 a24 18 0 0 1 48 0 v14 z" />
    <path d="M643 676 v-14 a24 18 0 0 1 48 0 v14 z" />
    <path d="M710 676 v-13 a24 17 0 0 1 48 0 v13 z" />
    <path d="M776 676 v-12 a24 15 0 0 1 48 0 v12 z" />
    <path d="M843 676 v-10 a24 13 0 0 1 48 0 v10 z" />
  </g>
  <g fill="#cdbd99">
    <path d="M357 676 l9 -9 l10 9 z M424 676 l9 -9 l9 9 z M490 676 l10 -9 l9 9 z M557 676 l9 -9 l10 9 z M624 676 l9 -9 l10 9 z M691 676 l9 -9 l10 9 z M758 676 l9 -9 l9 9 z M824 676 l10 -9 l9 9 z" />
  </g>
  <g fill="#2f5670" opacity=".35">
    <path d="M309 676 h48 l-6 14 h-36 z M376 676 h48 l-6 15 h-36 z M442 676 h48 l-6 16 h-36 z M509 676 h48 l-6 16 h-36 z M643 676 h48 l-6 16 h-36 z M710 676 h48 l-6 16 h-36 z M776 676 h48 l-6 15 h-36 z M843 676 h48 l-6 14 h-36 z" />
  </g>
  <!-- the legend: only eight real arches; the "ninth hole" is the sun glinting on the water -->
  <g class="glint">
    <path d="M576 676 v-14 a24 19 0 0 1 48 0 v14 z" fill="url(#glint)" />
    <path d="M600 648 l3 11 l11 3 l-11 3 l-3 11 l-3 -11 l-11 -3 l11 -3 z" fill="#fff" />
    <g stroke="#fffbe6" stroke-linecap="round" opacity=".9">
      <path d="M582 684 h36" stroke-width="4" />
      <path d="M586 696 h28" stroke-width="3.5" />
      <path d="M578 710 h44" stroke-width="3" />
      <path d="M588 726 h24" stroke-width="3" />
      <path d="M574 744 h40" stroke-width="2.5" />
      <path d="M584 764 h22" stroke-width="2.5" />
      <path d="M570 786 h32" stroke-width="2" />
    </g>
  </g>

  <!-- sweep well (gémeskút) with its bucket, well box and trough -->
  <path d="M1385 772 L1388 606 L1394 606 L1397 772 Z" fill="url(#wood)" />
  <path d="M1391 612 l-10 -14 M1391 612 l10 -14" stroke="#6b4a2b" stroke-width="6" stroke-linecap="round" />
  <path d="M1248 672 L1560 524" stroke="#7a5532" stroke-width="7" stroke-linecap="round" />
  <path d="M1248 672 L1560 524" stroke="#a07548" stroke-width="2" stroke-linecap="round" opacity=".7" />
  <path d="M1556 528 V708" stroke="#5a3d22" stroke-width="2.5" />
  <rect x="1232" y="662" width="26" height="18" rx="4" fill="#857b6c" />
  <path d="M1546 706 h20 l-3 15 h-14 z" fill="#5a3d22" />
  <path d="M1546 708 h20" stroke="#a07548" stroke-width="2" />
  <rect x="1528" y="722" width="56" height="42" fill="#8a6038" stroke="#5a3d22" stroke-width="3" />
  <path d="M1528 736 h56 M1528 750 h56" stroke="#6b4a2b" stroke-width="2" />
  <rect x="1438" y="750" width="82" height="14" rx="2" fill="#7a5532" />
  <rect x="1442" y="752" width="74" height="4" fill="#86c6ec" opacity=".8" />

  <!-- animals (class "animal": click one on the desktop and it tells a fact about Kristóf) -->
  <use href="#cow" class="animal cow" transform="translate(965 694) scale(.5)" />
  <g color="#f4f0e6">
    <use href="#sheep" class="animal sheep" transform="translate(930 760) scale(.72)" />
    <use href="#sheep" class="animal sheep" transform="translate(960 742) scale(.8)" />
    <use href="#sheep" class="animal sheep" transform="translate(1010 750) scale(.85)" />
    <use href="#sheep" class="animal sheep" transform="translate(1062 738) scale(.75)" />
    <use href="#sheep" class="animal sheep" transform="translate(1160 748) scale(.7)" />
  </g>
  <use href="#sheep" class="animal sheep black" transform="translate(1110 754) scale(.85)" color="#3b332c" />
  <use href="#cow" class="animal cow" transform="translate(1080 812) scale(1.1)" />
  <use href="#cow" class="animal cow" transform="translate(1250 842) scale(1.35)" />
  <use href="#cow" class="animal cow" transform="translate(880 790) scale(.8)" />

  <!-- foreground grass tufts -->
  <g stroke="#7a6c34" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M760 940 l-6 -22 M766 940 l2 -26 M772 940 l8 -20" />
    <path d="M1000 960 l-6 -22 M1006 960 l2 -26 M1012 960 l8 -20" />
    <path d="M1480 930 l-6 -22 M1486 930 l2 -26 M1492 930 l8 -20" />
    <path d="M1200 975 l-6 -22 M1206 975 l2 -26 M1212 975 l8 -20" />
    <path d="M1360 990 l-6 -22 M1366 990 l2 -26 M1372 990 l8 -20" />
    <path d="M880 990 l-5 -18 M885 990 l2 -22 M890 990 l7 -16" />
  </g>
</svg>
