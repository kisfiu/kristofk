name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pages path: "/" for <user>.github.io, "/<repo>" for any other repo name. Only the deploy build and its tests use it.
      PAGES_BASE: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      # Lighthouse serves dist/ from the root, so it gets its own root build.
      - run: npm run build
      - run: npm run lighthouse 2>&1 | tee lighthouse.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Report Lighthouse results as annotations
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const dir = ".lighthouseci";
            const log = fs.existsSync("lighthouse.log") ? fs.readFileSync("lighthouse.log", "utf8").trim().split("\n").slice(-20).join("%0A") : "";
            if (!fs.existsSync(dir) || !fs.readdirSync(dir).some((f) => f.startsWith("lhr-"))) { console.log("::error title=Lighthouse produced no results::" + log); process.exit(0); }
            for (const f of fs.readdirSync(dir).filter((f) => f.startsWith("lhr-") && f.endsWith(".json"))) {
              const { categories } = JSON.parse(fs.readFileSync(`${dir}/${f}`));
              console.log("::notice title=Lighthouse::" + Object.values(categories).map((c) => `${c.title} ${Math.round(c.score * 100)}`).join(", "));
            }
            const failed = fs.existsSync(`${dir}/assertion-results.json`) ? JSON.parse(fs.readFileSync(`${dir}/assertion-results.json`)) : [];
            for (const a of failed) console.log(`::error title=Lighthouse ${a.auditProperty || a.auditId}::${a.name} expected ${a.operator} ${a.expected}, got ${a.actual}`);
          '
      # The browser tests run against exactly the build that gets published.
      - name: Build for the repo's Pages path
        run: npm run build
        env:
          BASE_PATH: ${{ env.PAGES_BASE }}
      - run: npm run test:e2e
        env:
          BASE_PATH: ${{ env.PAGES_BASE }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
