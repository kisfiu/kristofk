name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run lighthouse
      - name: Report Lighthouse results as annotations
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const dir = ".lighthouseci";
            if (!fs.existsSync(dir)) { console.log("::error::Lighthouse produced no results"); process.exit(0); }
            for (const f of fs.readdirSync(dir).filter((f) => f.startsWith("lhr-") && f.endsWith(".json"))) {
              const { categories } = JSON.parse(fs.readFileSync(`${dir}/${f}`));
              console.log("::notice title=Lighthouse::" + Object.values(categories).map((c) => `${c.title} ${Math.round(c.score * 100)}`).join(", "));
            }
            const failed = fs.existsSync(`${dir}/assertion-results.json`) ? JSON.parse(fs.readFileSync(`${dir}/assertion-results.json`)) : [];
            for (const a of failed) console.log(`::error title=Lighthouse ${a.auditProperty || a.auditId}::${a.name} expected ${a.operator} ${a.expected}, got ${a.actual}`);
          '
      - name: Build for the repo's Pages path
        run: npm run build
        env:
          BASE_PATH: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}', github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
